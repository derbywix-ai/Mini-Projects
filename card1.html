<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Card</title>
    <style>
       body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .card {
            width: 320px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card h1 {
            color: #e74c3c;
            font-size: 28px;
            margin-top: 0;
        }

        .card p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
        }

        .card .from {
            margin-top: 20px;
            font-style: italic;
            color: #888;
        }
    </style>
</head>  
<body>
    <div class="card"> 
        <header>
            <h1>HELLO<br>
            GOOD MORNING!!!!!</h1>
    

        <p>
            Ready for a new day ;)<br>
            Let's go and have a great day!<br>
            Don't forget to eat on time and rest well. <br>There's only one of you.<br>
            That's all.<br>
            Sayonara 
        </p>

        <p class="from">-From Anonymous</p>
    </div>  

    
</body>
</html>

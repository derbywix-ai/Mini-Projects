<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
</head>
<body>
    <h1>Checkout</h1>

    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Colorful Rubik's cube puzzle toy">
        <p>Rubik's Cube - $12.99</p>
    </section>

    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">
                <span aria-hidden="true">*</span> Card Name:
            </label>
            <input type="text" id="card-name" name="card-name" required>

            <label for="card-number">
                <span aria-hidden="true">*</span> Card Number:
            </label>
            <input type="text" id="card-number" name="card-number" required aria-describedby="card-number-help">
            <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>

            <button type="submit">Pay Now</button>
        </form>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Card</title>
    <style>
       body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .card {
            width: 320px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card h1 {
            color: #e46254;
            font-size: 28px;
            margin-top: 0;
        }

        .card p {
            color: #ff009d;
            font-size: 16px;
            line-height: 1.6;
        }

        .card .from {
            margin-top: 20px;
            font-style: italic;
            color: #c0659d;
        }
    </style>
</head>  
<body>
    <div class="card"> 
        <header>
            <h1>Hugs<br>
            On this lovely day</h1>
    

        <p>
            I extend my bountiful love...<br>
            To God...<br>
           My family... <br>My friends...<br>
            And of course me!<br>
            I love you all.
        </p>

        <p class="from">-From Anonymous</p>
    </div>  

    
</body>
</html>

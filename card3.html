<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You Card</title>
    <style>
       body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .card {
            width: 320px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card h1 {
            color: #00ff00;
            font-size: 28px;
            margin-top: 0;
        }

        .card p {
            color: #fa8907e0;
            font-size: 16px;
            line-height: 1.6;
        }

        .card .from {
            margin-top: 20px;
            font-style: italic;
            color: #d37c7cbd;
        }
    </style>
</head>  
<body>
    <div class="card"> 
        <header>
            <h1>Thanksssssss<br>
            So Much</h1>
    

        <p>
            Grateful for your support<br>
            Grateful for your kindness<br>
            You really are amazing.<br>God bless you.<br>
            Once again thanksss<br>
            so much
        </p>

        <p class="from">-From Anonymous</p>
    </div>  

    
</body>
</html>

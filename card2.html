<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Card</title>
    <style>
       body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .card {
            width: 320px;
            background: rgb(131, 127, 127);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card h1 {
            color: #330f77;
            font-size: 28px;
            margin-top: 0;
        }

        .card p {
            color: #f3f710;
            font-size: 16px;
            line-height: 1.6;
        }

        .card .from {
            margin-top: 20px;
            font-style: italic;
            color: #b81111;
        }
    </style>
</head>  
<body>
    <div class="card"> 
        <header>
            <h1>HAPPY BIRTHDAY<br>
            :)</h1>
    

        <p>
            Wishing you joy<br>
            peace<br>
            laughter<br>fun<br>
            and the very best<br>
          ENJOY!!!!
        </p>

        <p class="from">-From Anonymous</p>
    </div>  

    
</body>
</html>

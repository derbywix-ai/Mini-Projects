<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sympathy Card</title>
    <style>
       body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .card {
            width: 320px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card h1 {
            color: #e73c9a;
            font-size: 28px;
            margin-top: 0;
        }

        .card p {
            color: #e6a1a1;
            font-size: 16px;
            line-height: 1.6;
        }

        .card .from {
            margin-top: 20px;
            font-style: italic;
            color: #426ee6;
        }
    </style>
</head>  
<body>
    <div class="card"> 
        <header>
            <h1>With<br>
            Sympathy</h1>
    

        <p>
            I can't believe this happened?<br>
            You doing ok?<br>
           Remember you got someone to talk to.<br>Don't worry<br>
            There are more fishes in the sea.<br>
            Fighting!! 
        </p>

        <p class="from">-From Anonymous</p>
    </div>  

    
</body>
</html>

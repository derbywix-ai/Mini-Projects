<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations Card</title>
    <style>
       body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .card {
            width: 320px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card h1 {
            color: #c53ce7;
            font-size: 28px;
            margin-top: 0;
        }

        .card p {
            color: #837bd1;
            font-size: 16px;
            line-height: 1.6;
        }

        .card .from {
            margin-top: 20px;
            font-style: italic;
            color: #04ffea;
        }
    </style>
</head>  
<body>
    <div class="card"> 
        <header>
            <h1>Yay!!!<br>
            Congrats!!!!!</h1>
    

        <p>
            You did it!<br>
            You overcame that trial!<br>
            So proud of you. <br>You deserve all the success.<br>
            *Sniff*<br>
            I think I'm gonna cry.
        </p>

        <p class="from">-From Anonymous</p>
    </div>  

    
</body>
</html>

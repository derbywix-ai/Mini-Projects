<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Well Soon Card</title>
    <style>
       body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .card {
            width: 320px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card h1 {
            color: #10ffeb;
            font-size: 28px;
            margin-top: 0;
        }

        .card p {
            color: #16b95a;
            font-size: 16px;
            line-height: 1.6;
        }

        .card .from {
            margin-top: 20px;
            font-style: italic;
            color: #23fc23;
        }
    </style>
</head>  
<body>
    <div class="card"> 
        <header>
            <h1>HELLO<br>
            Get Well Soon</h1>
    

        <p>
            Awwww! You poor thing.<br>
            How did you get so ill?<br>
            Have you eaten? <br>Have you taken your medications?<br>
            Rest well, please.<br>
            Wishing you a speedy recovery.
        </p>

        <p class="from">-From Anonymous</p>
    </div>  

    
</body>
</html>

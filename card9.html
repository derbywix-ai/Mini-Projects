<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Card</title>
    <style>
       body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .card {
            width: 320px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card h1 {
            color: #3ce789;
            font-size: 28px;
            margin-top: 0;
        }

        .card p {
            color: #ffcaca;
            font-size: 16px;
            line-height: 1.6;
        }

        .card .from {
            margin-top: 20px;
            font-style: italic;
            color: #0a07aa;
        }
    </style>
</head>  
<body>
    <div class="card"> 
        <header>
            <h1>HAPPY<br>
              NEW<br>
            YEAR!!!!!</h1>
    

        <p>
            We made it!!!!!!!!<br>
            Thank you Jesus!!!<br>
            Now onward into the new year. <br>With happiness, health and success!<br>
            See you at the end, better you.<br>
           Cheers! 
        </p>

        <p class="from">-From Anonymous</p>
    </div>  

    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendship Card</title>
    <style>
       body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .card {
            width: 320px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card h1 {
            color: #ff6702;
            font-size: 28px;
            margin-top: 0;
        }

        .card p {
            color: #d0e612;
            font-size: 16px;
            line-height: 1.6;
        }

        .card .from {
            margin-top: 20px;
            font-style: italic;
            color: #2075a7;
        }
    </style>
</head>  
<body>
    <div class="card"> 
        <header>
            <h1>Bonjour<br>
            Mon ami!</h1>
    

        <p>
            My wonderful friend<br>
            That loves to watch movies<br>
            Never messes with boundries<br>And always with the latest gist.<br>
            You're the best.<br>
           *Hugs*
        </p>

        <p class="from">-From Anonymous</p>
    </div>  

    
</body>
</html>
